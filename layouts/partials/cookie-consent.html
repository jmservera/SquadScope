{{- $cfg := .Site.Data.cookieconsent -}}
{{- $cfgJSON := $cfg | jsonify -}}
{{- $cfgJSON = replace $cfgJSON "__PRIVACY_URL__" ("privacy/" | relURL) -}}
<link rel="stylesheet" href="{{ "vendor/cookieconsent/cookieconsent.css" | relURL }}">
<script>
  window.SquadScopeCookieConsent = {{ $cfgJSON | safeJS }};
</script>
<script>
  (function () {
    var script = document.createElement('script');
    script.src = '{{ "vendor/cookieconsent/cookieconsent.umd.js" | relURL }}';
    script.async = true;
    script.onload = function () {
      var cfg = window.SquadScopeCookieConsent || {};

      function reviveCookiePattern(cookie) {
        if (!cookie || typeof cookie.name !== 'string') return cookie;
        var match = cookie.name.match(/^\/(.*)\/([gimsuy]*)$/);
        if (!match) return cookie;

        return Object.assign({}, cookie, {
          name: new RegExp(match[1], match[2])
        });
      }

      function reviveCookiePatterns(categories) {
        Object.keys(categories || {}).forEach(function (categoryName) {
          var category = categories[categoryName];
          if (category.autoClear && Array.isArray(category.autoClear.cookies)) {
            category.autoClear.cookies = category.autoClear.cookies.map(reviveCookiePattern);
          }

          Object.keys(category.services || {}).forEach(function (serviceName) {
            var service = category.services[serviceName];
            if (Array.isArray(service.cookies)) {
              service.cookies = service.cookies.map(reviveCookiePattern);
            }
          });
        });
      }

      reviveCookiePatterns(cfg.categories);

      function analyticsMeasurementId() {
        return window.SquadScopeAnalytics && window.SquadScopeAnalytics.gaMeasurementId;
      }

      function disableGoogleAnalytics() {
        var measurementId = analyticsMeasurementId();
        if (measurementId) {
          window['ga-disable-' + measurementId] = true;
        }
      }

      function loadGoogleAnalytics() {
        var measurementId = analyticsMeasurementId();
        if (!measurementId) return;

        window['ga-disable-' + measurementId] = false;
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () {
          window.dataLayer.push(arguments);
        };

        if (!window.SquadScopeGA4Loaded) {
          window.SquadScopeGA4Loaded = true;
          window.gtag('js', new Date());
          window.gtag('config', measurementId, { anonymize_ip: true });

          var gaScript = document.createElement('script');
          gaScript.async = true;
          gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(measurementId);
          document.head.appendChild(gaScript);
        }
      }

      function updateAnalyticsConsent() {
        if (CookieConsent.acceptedCategory('analytics')) {
          loadGoogleAnalytics();
        } else {
          disableGoogleAnalytics();
        }
      }

      var userOnConsent = cfg.onConsent;
      var userOnChange = cfg.onChange;
      var runConfig = Object.assign({
        mode: 'opt-in',
        revision: 1,
        hideFromBots: false,
        manageScriptTags: false,
        cookie: {
          name: 'squadscope_cookie_consent',
          sameSite: 'Lax',
          expiresAfterDays: 182
        },
        guiOptions: {
          consentModal: {
            layout: 'cloud inline',
            position: 'bottom center',
            equalWeightButtons: true,
            flipButtons: false
          },
          preferencesModal: {
            layout: 'box',
            equalWeightButtons: true,
            flipButtons: false
          }
        }
      }, cfg);

      runConfig.onConsent = function (cookie) {
        updateAnalyticsConsent();
        if (typeof userOnConsent === 'function') {
          userOnConsent(cookie);
        }
      };

      runConfig.onChange = function (cookie, changedCategories, changedServices) {
        updateAnalyticsConsent();
        if (typeof userOnChange === 'function') {
          userOnChange(cookie, changedCategories, changedServices);
        }
      };

      disableGoogleAnalytics();
      CookieConsent.run(runConfig);
    };
    document.head.appendChild(script);
  })();
</script>
