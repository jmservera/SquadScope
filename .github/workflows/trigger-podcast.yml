name: Trigger podcast generation

on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Operational dispatch workflow (not a release build). The required run ID selects retained publish evidence and does not alter build output.
    inputs:
      week:
        description: 'Week slug, e.g. 2026-W25'
        required: true
        type: string
      publish_run_id:
        description: 'Exact crawl-and-publish workflow run ID that produced the manifest.'
        required: true
        type: string
      breaking_news:
        description: 'Optional last-moment news or important information to include in this podcast episode.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-podcast:
    # Defense-in-depth: the workflow YAML executed for a manual dispatch comes
    # from the dispatched ref, not from main, even though the job checks out
    # the default branch. Refuse to run unless dispatched from main so the
    # environment-scoped secrets are only reachable from the reviewed workflow.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: podcaster-real-generation
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Derive paths from week slug
        id: derive
        env:
          WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail
          if [[ ! "$WEEK" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo "::error::week must match YYYY-WNN (two-digit week), e.g. 2026-W25 (got: $WEEK)"
            exit 1
          fi

          # 2026-W25 → year=2026, short=W25
          YEAR="${WEEK%%-*}"
          SHORT="${WEEK##*-}"
          echo "article_path=content/weekly/${YEAR}/${SHORT}.md" >> "$GITHUB_OUTPUT"
          echo "article_url=https://claracle.com/weekly/${YEAR}/${SHORT}/" >> "$GITHUB_OUTPUT"

      - name: Locate publish manifest from crawl-and-publish
        id: manifest-locate
        env:
          WEEK: ${{ inputs.week }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$PUBLISH_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::publish_run_id must be a numeric workflow run ID (got: $PUBLISH_RUN_ID)"
            exit 1
          fi
          if ! git fetch origin publish 2>/dev/null; then
            echo "::error::Could not fetch publish branch. Has crawl-and-publish run yet?"
            exit 1
          fi
          MANIFEST="data/candidates/${WEEK}/${PUBLISH_RUN_ID}/publish-manifest.json"
          if ! git checkout origin/publish -- "$MANIFEST" 2>/dev/null; then
            echo "::error::Manifest not found at $MANIFEST for exact run $PUBLISH_RUN_ID"
            exit 1
          fi
          python3 - "$MANIFEST" "$WEEK" "$PUBLISH_RUN_ID" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          requested_week = sys.argv[2]
          requested_run_id = sys.argv[3]
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("week") != requested_week:
              raise SystemExit("::error::Manifest week does not match requested week")
          if str(manifest.get("run_id")) != requested_run_id:
              raise SystemExit("::error::Manifest run_id does not match requested publish_run_id")
          candidate = manifest.get("candidate") or {}
          article_sha256 = candidate.get("content_sha256")
          if not isinstance(article_sha256, str) or len(article_sha256) != 64:
              raise SystemExit("::error::Manifest candidate content_sha256 is missing or invalid")
          manifest_sha256 = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"manifest_path={manifest_path}\n")
              output.write(f"manifest_sha256={manifest_sha256}\n")
              output.write(f"article_sha256={article_sha256}\n")
              output.write(f"publish_run_id={requested_run_id}\n")
          PY

      - name: Trigger podcast generation with existing manifest
        id: handoff
        env:
          PODCASTER_ENDPOINT: ${{ vars.PODCASTER_ENDPOINT }}
          PODCASTER_API_KEY: ${{ secrets.PODCASTER_API_KEY }}
          WEEK: ${{ inputs.week }}
          ARTICLE_URL: ${{ steps.derive.outputs.article_url }}
          ARTICLE_PATH: ${{ steps.derive.outputs.article_path }}
          MANIFEST_FILE: ${{ steps.manifest-locate.outputs.manifest_path }}
          PUBLISH_RUN_ID: ${{ steps.manifest-locate.outputs.publish_run_id }}
          TRIGGER_RUN_ID: ${{ github.run_id }}
          BREAKING_NEWS: ${{ inputs.breaking_news || '' }}
        run: |
          set -euo pipefail
          if [ -z "$PODCASTER_ENDPOINT" ] || [ -z "$PODCASTER_API_KEY" ]; then
            echo "::error::Requires PODCASTER_ENDPOINT variable and PODCASTER_API_KEY secret."
            exit 1
          fi
          if [ ! -f "$ARTICLE_PATH" ]; then
            echo "::error::Article '$ARTICLE_PATH' is not merged on the default branch."
            exit 1
          fi
          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "::error::Manifest file not found: $MANIFEST_FILE"
            exit 1
          fi
          echo "::notice::Using manifest from crawl-and-publish run $PUBLISH_RUN_ID ($(date -r "$MANIFEST_FILE" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo 'date unknown'))"

          BREAKING_ARGS=()
          if [ -n "$BREAKING_NEWS" ]; then
            BREAKING_ARGS=(--breaking-news "$BREAKING_NEWS")
          fi

          # Trigger real podcast generation using the existing validated manifest
          python3 scripts/podcaster_handoff.py \
            --week "$WEEK" \
            --article-url "$ARTICLE_URL" \
            --article-path "$ARTICLE_PATH" \
            --publish-run-id "$PUBLISH_RUN_ID" \
            --publish-mode normal \
            --manifest "$MANIFEST_FILE" \
            --podcast-config config/podcast.json \
            --require-merged \
            "${BREAKING_ARGS[@]}"

      - name: Retain real generation evidence
        if: always()
        env:
          HANDOFF_OUTCOME: ${{ steps.handoff.outcome }}
          PODCASTER_JOB_ID: ${{ steps.handoff.outputs.podcaster_job_id }}
          PODCASTER_STATUS: ${{ steps.handoff.outputs.podcaster_status }}
          WEEK: ${{ inputs.week }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
          MANIFEST_PATH: ${{ steps.manifest-locate.outputs.manifest_path }}
          MANIFEST_SHA256: ${{ steps.manifest-locate.outputs.manifest_sha256 }}
          ARTICLE_PATH: ${{ steps.derive.outputs.article_path }}
          ARTICLE_SHA256: ${{ steps.manifest-locate.outputs.article_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISPATCHER: ${{ github.actor }}
        run: |
          {
            echo "## Podcaster real-generation evidence"
            echo ""
            echo "- Workflow conclusion: ${HANDOFF_OUTCOME}"
            echo "- Dispatcher: ${DISPATCHER}"
            echo "- Week: ${WEEK}"
            echo "- Publish run ID: ${PUBLISH_RUN_ID}"
            echo "- Manifest: ${MANIFEST_PATH}"
            echo "- Manifest SHA-256: ${MANIFEST_SHA256}"
            echo "- Article: ${ARTICLE_PATH}"
            echo "- Article SHA-256: ${ARTICLE_SHA256}"
            echo "- Podcaster response status: ${PODCASTER_STATUS}"
            echo "- Podcaster job ID: ${PODCASTER_JOB_ID}"
            echo "- Actions run: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
