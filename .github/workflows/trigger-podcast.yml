name: Trigger podcast generation

on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Operational dispatch workflow (not a release build). The required run ID selects retained publish evidence and does not alter build output.
    inputs:
      week:
        description: 'Week slug, e.g. 2026-W25'
        required: true
        type: string
      publish_run_id:
        description: 'Exact crawl-and-publish workflow run ID that produced the manifest.'
        required: true
        type: string
      breaking_news:
        description: 'Optional last-moment news or important information to include in this podcast episode.'
        required: false
        type: string
      regenerate_of:
        description: 'Job ID of a defective episode this run supersedes (e.g. placeholder script). Requires regeneration_reason.'
        required: false
        type: string
      regeneration_reason:
        description: 'Why the prior episode is being regenerated. Requires regenerate_of.'
        required: false
        type: string

run-name: "Trigger podcast generation: ${{ inputs.week }} / ${{ inputs.publish_run_id }}"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trigger-podcast:
    # Defense-in-depth: the workflow YAML executed for a manual dispatch comes
    # from the dispatched ref, not from main, even though the job checks out
    # the default branch. Refuse to run unless dispatched from main so the
    # environment-scoped secrets are only reachable from the reviewed workflow.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: podcast-dispatch-${{ inputs.week }}-${{ inputs.publish_run_id }}
      cancel-in-progress: false
    environment:
      name: podcaster-real-generation
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Derive paths from week slug
        id: derive
        env:
          WEEK: ${{ inputs.week }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
          BREAKING_NEWS: ${{ inputs.breaking_news || '' }}
          REGENERATE_OF: ${{ inputs.regenerate_of || '' }}
          REGENERATION_REASON: ${{ inputs.regeneration_reason || '' }}
        run: |
          set -euo pipefail
          python3 scripts/podcaster_handoff.py prepare-release \
            --week "$WEEK" \
            --publish-run-id "$PUBLISH_RUN_ID" \
            --breaking-news "$BREAKING_NEWS" \
            --regenerate-of "$REGENERATE_OF" \
            --regeneration-reason "$REGENERATION_REASON"

      - name: Locate publish manifest from crawl-and-publish
        id: manifest-locate
        env:
          MANIFEST_PATH: ${{ steps.derive.outputs.manifest_path }}
          MANIFEST_SHA256: ${{ steps.derive.outputs.manifest_sha256 }}
          ARTICLE_SHA256: ${{ steps.derive.outputs.article_sha256 }}
          PUBLISH_RUN_ID: ${{ steps.derive.outputs.publish_run_id }}
        run: |
          # Retain the historical step outputs used by dispatch evidence readers.
          {
            echo "manifest_path=$MANIFEST_PATH"
            echo "manifest_sha256=$MANIFEST_SHA256"
            echo "article_sha256=$ARTICLE_SHA256"
            echo "publish_run_id=$PUBLISH_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Trigger podcast generation with existing manifest
        id: handoff
        env:
          PODCASTER_ENDPOINT: ${{ vars.PODCASTER_ENDPOINT }}
          PODCASTER_API_KEY: ${{ secrets.PODCASTER_API_KEY }}
          WEEK: ${{ inputs.week }}
          ARTICLE_URL: ${{ steps.derive.outputs.article_url }}
          ARTICLE_PATH: ${{ steps.derive.outputs.article_path }}
          MANIFEST_FILE: ${{ steps.manifest-locate.outputs.manifest_path }}
          PUBLISH_RUN_ID: ${{ steps.manifest-locate.outputs.publish_run_id }}
          TRIGGER_RUN_ID: ${{ github.run_id }}
          BREAKING_NEWS: ${{ inputs.breaking_news || '' }}
          REGENERATE_OF: ${{ inputs.regenerate_of || '' }}
          REGENERATION_REASON: ${{ inputs.regeneration_reason || '' }}
        run: |
          set -euo pipefail
          if [ -z "$PODCASTER_ENDPOINT" ] || [ -z "$PODCASTER_API_KEY" ]; then
            echo "::error::Requires PODCASTER_ENDPOINT variable and PODCASTER_API_KEY secret."
            exit 1
          fi
          PODCAST_CONFIG="config/podcast.json"
          if [ "$WEEK" = "2026-W44" ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("config/podcast.json").read_text(encoding="utf-8"))
          style = config["script_directions"]["episode_style"]
          if style["format"].count("1200-1700 words.") != 1:
              raise SystemExit("::error::W44 caller length baseline changed; reconcile before generation.")
          style["format"] = style["format"].replace("1200-1700 words.", "1001-1700 spoken words.")
          Path("config/podcast-2026-W44.json").write_text(json.dumps(config), encoding="utf-8")
          print("::notice::W44 requested canonical host speech: 1001-1700 words inclusive.")
          PY
            PODCAST_CONFIG="config/podcast-2026-W44.json"
          fi
          BREAKING_ARGS=()
          if [ -n "$BREAKING_NEWS" ]; then
            BREAKING_ARGS=(--breaking-news "$BREAKING_NEWS")
          fi
          if [ -n "$REGENERATE_OF" ]; then
            BREAKING_ARGS+=(--regenerate-of "$REGENERATE_OF" --regeneration-reason "$REGENERATION_REASON")
          fi

          # Trigger real podcast generation using the existing validated manifest
          python3 scripts/podcaster_handoff.py \
            --week "$WEEK" \
            --article-url "$ARTICLE_URL" \
            --article-path "$ARTICLE_PATH" \
            --publish-run-id "$PUBLISH_RUN_ID" \
            --publish-mode normal \
            --manifest "$MANIFEST_FILE" \
            --podcast-config "$PODCAST_CONFIG" \
            --require-merged \
            "${BREAKING_ARGS[@]}"

      - name: Retain real generation evidence
        if: always()
        env:
          DERIVE_CONCLUSION: ${{ steps.derive.conclusion }}
          MANIFEST_LOCATE_CONCLUSION: ${{ steps.manifest-locate.conclusion }}
          HANDOFF_OUTCOME: ${{ steps.handoff.outcome }}
          HANDOFF_CONCLUSION: ${{ steps.handoff.conclusion }}
          PODCASTER_JOB_ID: ${{ steps.handoff.outputs.podcaster_job_id }}
          PODCASTER_RECEIPT_STATE: ${{ steps.handoff.outputs.podcaster_receipt_state }}
          PODCASTER_STATUS: ${{ steps.handoff.outputs.podcaster_status }}
          WEEK: ${{ inputs.week }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
          MANIFEST_PATH: ${{ steps.manifest-locate.outputs.manifest_path }}
          MANIFEST_SHA256: ${{ steps.manifest-locate.outputs.manifest_sha256 }}
          ARTICLE_PATH: ${{ steps.derive.outputs.article_path }}
          ARTICLE_SHA256: ${{ steps.manifest-locate.outputs.article_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISPATCHER: ${{ github.actor }}
        run: |
          RECEIPT_STATE="${PODCASTER_RECEIPT_STATE:-}"
          if [ -z "$RECEIPT_STATE" ]; then
            RECEIPT_STATE="pre_submit_failed"
          fi
          export RECEIPT_STATE
          python3 - <<'PY'
          import json
          import os

          record = {
              "schema_version": "podcast_dispatch_receipt_v1",
              "workflow": "trigger-podcast",
              "dispatcher": os.environ.get("DISPATCHER", "").strip(),
              "receipt_state": os.environ.get("RECEIPT_STATE", "").strip(),
              "week": os.environ.get("WEEK", "").strip(),
              "publish_run_id": os.environ.get("PUBLISH_RUN_ID", "").strip(),
              "article_sha256": os.environ.get("ARTICLE_SHA256", "").strip(),
              "manifest_sha256": os.environ.get("MANIFEST_SHA256", "").strip(),
              "podcaster_status": os.environ.get("PODCASTER_STATUS", "").strip(),
              "podcaster_job_id": os.environ.get("PODCASTER_JOB_ID", "").strip(),
              "actions_run_url": os.environ.get("RUN_URL", "").strip(),
          }
          print(f"PODCAST_DISPATCH_RECEIPT::{json.dumps(record, sort_keys=True, separators=(',', ':'))}")
          PY
          {
            echo "## Podcaster real-generation evidence"
            echo ""
            echo "- Receipt state: ${RECEIPT_STATE}"
            echo "- Workflow conclusion: ${HANDOFF_OUTCOME}"
            echo "- Dispatcher: ${DISPATCHER}"
            echo "- Week: ${WEEK}"
            echo "- Publish run ID: ${PUBLISH_RUN_ID}"
            echo "- Manifest: ${MANIFEST_PATH}"
            echo "- Manifest SHA-256: ${MANIFEST_SHA256}"
            echo "- Article: ${ARTICLE_PATH}"
            echo "- Article SHA-256: ${ARTICLE_SHA256}"
            echo "- Podcaster response status: ${PODCASTER_STATUS}"
            echo "- Podcaster job ID: ${PODCASTER_JOB_ID}"
            echo "- Actions run: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
