name: Hugo and Pagefind build-cost experiment

#checkov:skip=CKV_GHA_7: Immutable reviewed SHAs and a constrained 3/5 repetition choice are required evidence inputs.
on:
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Reviewed main commit (exact 40-character lowercase SHA)
        required: true
        type: string
      reviewed_publish_sha:
        description: Reviewed publish commit (exact 40-character lowercase SHA)
        required: true
        type: string
      repetitions:
        description: Comparable paired repetitions
        required: true
        default: '5'
        type: choice
        options:
          - '3'
          - '5'

permissions:
  contents: read

concurrency:
  group: hugo-pagefind-build-cost-experiment
  cancel-in-progress: false

jobs:
  report:
    name: Report-only build-cost experiment
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.161.1
      PAGEFIND_VERSION: 1.5.2
      REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
      REVIEWED_PUBLISH_SHA: ${{ inputs.reviewed_publish_sha }}
      REPETITIONS: ${{ inputs.repetitions }}
      WORKFLOW_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      BLOCKING_THRESHOLD_MS: 'null'

    steps:
      - name: Check out exact reviewed main commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.reviewed_main_sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Admit immutable reviewed commits
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          if [[ ! "${REVIEWED_MAIN_SHA}" =~ ${sha_pattern} ]]; then
            echo "::error::reviewed_main_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          if [[ ! "${REVIEWED_PUBLISH_SHA}" =~ ${sha_pattern} ]]; then
            echo "::error::reviewed_publish_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          if [[ "${REVIEWED_MAIN_SHA}" != "${WORKFLOW_SHA}" ]]; then
            echo "::error::reviewed_main_sha must equal the selected main workflow commit" >&2
            exit 1
          fi
          git fetch --no-tags origin publish
          git cat-file -e "${REVIEWED_PUBLISH_SHA}^{commit}"
          if ! git merge-base --is-ancestor "${REVIEWED_PUBLISH_SHA}" origin/publish; then
            echo "::error::reviewed_publish_sha is not reachable from origin/publish" >&2
            exit 1
          fi
          printf 'main=%s\npublish=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse "${REVIEWED_PUBLISH_SHA}^{commit}")"

      - name: Hydrate canonical corpus from exact publish commit
        run: |
          set -euo pipefail
          generated_paths="$(python3 -m scripts.publish_hydration paths)"
          while IFS= read -r path; do
            path="${path%/}"
            if [[ -z "${path}" ]]; then
              continue
            fi
            if [[ -n "$(git ls-tree -r --name-only "${REVIEWED_PUBLISH_SHA}" -- "${path}")" ]]; then
              rm -rf -- "${path}"
              git checkout "${REVIEWED_PUBLISH_SHA}" -- "${path}"
            fi
          done <<< "${generated_paths}"

      - name: Verify hydrated references and disabled rollouts
        run: |
          set -euo pipefail
          python3 -m scripts.publish_hydration check
          python3 - <<'PY'
          from pathlib import Path
          from scripts.build_cost_experiment import assert_rollouts_disabled

          assert_rollouts_disabled(Path.cwd())
          print("Repository-page and dynamic-topic rollout flags are disabled.")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install checksum-verified Hugo
        run: | # zizmor: ignore[github-env] fixed runner tool paths only
          set -euo pipefail
          release_url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          checksum_file="hugo_${HUGO_VERSION}_checksums.txt"
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors \
            --output "${tarball}" "${release_url}/${tarball}"
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors \
            --output "${checksum_file}" "${release_url}/${checksum_file}"
          checksum_line="$(awk -v file="${tarball}" '$NF == file {print; found=1} END {if (!found) exit 1}' "${checksum_file}")"
          printf '%s\n' "${checksum_line}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -C "${RUNNER_TEMP}/hugo" -xf "${tarball}"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
          rm -- "${tarball}" "${checksum_file}"

      - name: Install exact Pagefind outside measured intervals
        run: | # zizmor: ignore[github-env,adhoc-packages] exact Pagefind version is an intentional controlled experiment variable installed outside timing
          set -euo pipefail
          npm install --global --prefix "${RUNNER_TEMP}/pagefind" "pagefind@${PAGEFIND_VERSION}"
          echo "${RUNNER_TEMP}/pagefind/bin" >> "${GITHUB_PATH}"

      - name: Run isolated report-only experiment
        run: |
          set -euo pipefail
          python3 -m scripts.build_cost_experiment \
            --source . \
            --reports reports/build-cost-experiment \
            --repetitions "${REPETITIONS}" \
            --main-sha "${REVIEWED_MAIN_SHA}" \
            --publish-sha "${REVIEWED_PUBLISH_SHA}" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --run-id "${RUN_ID}" \
            --run-attempt "${RUN_ATTEMPT}" \
            --runner-os "${RUNNER_OS}" \
            --runner-arch "${RUNNER_ARCH}" \
            --image-os "${ImageOS:-ubuntu24}" \
            --image-version "${ImageVersion:-unknown}"

      - name: Add report to job summary
        if: ${{ always() }}
        run: | # zizmor: ignore[github-env] appends only the generated report to the job summary
          summary='reports/build-cost-experiment/summary.md'
          if [[ -f "${summary}" ]]; then
            cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          else
            printf '%s\n' 'Build-cost experiment did not produce a complete summary. Inspect the retained samples and logs.' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload report-only evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hugo-pagefind-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/build-cost-experiment/
          retention-days: 90
          if-no-files-found: warn