name: Podcaster handoff smoke test

on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Manual release acceptance requires exact retained promotion evidence and does not alter published artifacts.
    inputs:
      week:
        description: 'Week slug to validate, e.g. 2026-W23.'
        required: true
        type: string
      article_url:
        description: 'Published SquadScope article URL to send to Podcaster.'
        required: true
        type: string
      article_path:
        description: 'Published article path, e.g. content/weekly/2026/W23.md.'
        required: true
        type: string
      article_sha256:
        description: 'Exact lowercase SHA-256 of the promoted article bytes.'
        required: true
        type: string
      promotion_reference:
        description: 'Repository-relative promotion record or publish manifest path.'
        required: true
        type: string
  workflow_call:
    inputs:
      week:
        description: 'Week slug to validate.'
        required: true
        type: string
      article_url:
        description: 'Published article URL sent to Podcaster.'
        required: true
        type: string
      article_path:
        description: 'Repository-relative promoted article path.'
        required: true
        type: string
      article_sha256:
        description: 'Exact lowercase SHA-256 of the promoted article bytes.'
        required: true
        type: string
      promotion_reference:
        description: 'Repository-relative promotion record or publish manifest path.'
        required: true
        type: string
    secrets:
      PODCASTER_API_KEY:
        description: 'API key for the Podcaster generation endpoint.'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: podcaster-release-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Hydrate published article from publish
        # The handoff tooling (scripts/, config/) lives on the default branch,
        # while the promoted article, its promotion record, and the source
        # manifest that record references all live on publish.
        env:
          ARTICLE_PATH: ${{ inputs.article_path }}
          PROMOTION_REFERENCE: ${{ inputs.promotion_reference }}
        run: |
          set -euo pipefail
          git fetch origin publish
          git checkout FETCH_HEAD -- "$ARTICLE_PATH" "$PROMOTION_REFERENCE"
          # promotion_transaction_v1 records reference a source manifest whose
          # bytes the handoff tooling also verifies; hydrate it from publish too.
          # Restrict hydration to the expected candidate-manifest location so a
          # crafted record cannot overwrite tooling/config in the working tree,
          # and fail the step on any other path rather than silently skipping.
          SOURCE_MANIFEST_PATH="$(python3 - "$PROMOTION_REFERENCE" <<'PY'
          import json
          import re
          import sys

          try:
              record = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, ValueError):
              raise SystemExit(0)
          source_manifest = record.get("source_manifest")
          if not isinstance(source_manifest, dict):
              raise SystemExit(0)
          path = source_manifest.get("path")
          if path is None:
              raise SystemExit(0)
          if not isinstance(path, str) or not re.fullmatch(
              r"data/candidates/[^/]+/[^/]+/publish-manifest\.json", path
          ):
              sys.stderr.write(f"::error::unexpected source_manifest.path: {path!r}\n")
              raise SystemExit(1)
          print(path)
          PY
          )"
          if [ -n "$SOURCE_MANIFEST_PATH" ]; then
            git checkout FETCH_HEAD -- "$SOURCE_MANIFEST_PATH"
          fi

      - name: Smoke test Podcaster dry run
        env:
          PODCASTER_ENDPOINT: ${{ vars.PODCASTER_ENDPOINT }}
          PODCASTER_API_KEY: ${{ secrets.PODCASTER_API_KEY }}
          WEEK: ${{ inputs.week }}
          ARTICLE_URL: ${{ inputs.article_url }}
          ARTICLE_PATH: ${{ inputs.article_path }}
          ARTICLE_SHA256: ${{ inputs.article_sha256 }}
          PROMOTION_REFERENCE: ${{ inputs.promotion_reference }}
        run: |
          set -euo pipefail
          if [ -z "$PODCASTER_ENDPOINT" ] || [ -z "$PODCASTER_API_KEY" ]; then
            echo "::error::Podcaster smoke test requires PODCASTER_ENDPOINT variable and PODCASTER_API_KEY secret."
            exit 1
          fi
          python3 scripts/podcaster_handoff.py \
            --week "$WEEK" \
            --article-url "$ARTICLE_URL" \
            --article-path "$ARTICLE_PATH" \
            --publish-mode normal \
            --promotion-reference "$PROMOTION_REFERENCE" \
            --expected-article-sha256 "$ARTICLE_SHA256" \
            --podcast-config config/podcast.json \
            --podcaster-dry-run \
            --exact-article-content

      - name: Retain smoke run evidence
        if: always()
        env:
          ARTICLE_PATH: ${{ inputs.article_path }}
          ARTICLE_SHA256: ${{ inputs.article_sha256 }}
          RUN_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Podcaster release smoke"
            echo
            echo "- Status: ${RUN_STATUS}"
            echo "- Article: \`${ARTICLE_PATH}\`"
            echo "- SHA-256: \`${ARTICLE_SHA256}\`"
            echo "- Actions run: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
