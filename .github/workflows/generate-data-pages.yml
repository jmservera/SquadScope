name: Generate data pages

on:
  schedule:
    # Regenerate citable rankings monthly after the weekly crawl has had time
    # to publish checked-in raw artifacts. This workflow reads existing data only.
    - cron: '23 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-pages
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Generate data pages
        run: python3 scripts/generate_data_pages.py

      - name: Open regeneration pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: data-pages/monthly-${{ github.run_id }}
        run: |
          set -euo pipefail
          if git diff --quiet -- content/data; then
            echo "Data pages are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH_NAME"
          git add content/data
          git commit -m "data: regenerate observatory pages"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:$BRANCH_NAME"
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "data: regenerate observatory pages" \
            --body "Regenerates Claracle data pages from checked-in data artifacts. No crawl is performed."
