name: Check Observatory freshness

on:
  schedule:
    # Verify citable Observatory outputs monthly without creating publication state.
    - cron: '23 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-pages
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Hydrate generated state from publish
        run: |
          set -euo pipefail
          git fetch origin publish
          GENERATED_PATHS=(
            content/weekly/
            content/topics/
            content/repo/
            content/data/
            data/raw/
            data/analyzed/
            data/taxonomy/
            data/topic-hubs/
            data/derived/observatory/
            static/datasets/open-source-ai-github-projects-2026/
            static/tools/star-velocity-explorer.json
          )
          for path in "${GENERATED_PATHS[@]}"; do
            path="${path%/}"
            # Only mirror paths present on publish; otherwise keep main's committed
            # version so generated content not yet published is not deleted (#633).
            if [ -n "$(git ls-tree -r --name-only origin/publish -- "$path")" ]; then
              rm -rf "$path"
              git checkout origin/publish -- "$path"
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check generated Observatory freshness
        run: |
          set -euo pipefail
          python3 scripts/discover_topic_candidates.py --check
          python3 scripts/observatory_repos.py --check
          python3 scripts/generate_repository_summary.py --from-crawl --check
          python3 scripts/capture_repository_production_snapshot.py --check
          python3 scripts/generate_repository_url_inventory.py --check
          python3 scripts/generate_data_pages.py --check
          python3 scripts/export_observatory_dataset.py --check
          python3 scripts/export_trend_explorer_data.py --check
