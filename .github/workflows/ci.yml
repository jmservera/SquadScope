name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # Full history so the atomic-publish-proof integration test resolves
          # origin/publish and seeds its isolated origin from a complete object
          # graph (matches the production-site jobs).
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run Python tests
        run: |
          python -m pytest \
            --ignore=tests/test_rendered_seo_metadata.py \
            --ignore=tests/test_rendered_weekly_links.py \
            --ignore=tests/test_internal_link_checker.py \
            --ignore=tests/test_topic_hubs.py

      - name: Validate image registry
        run: python scripts/manage_image_registry.py validate

      - name: Validate content images (no hotlinks/secrets)
        run: python scripts/validate_content_images.py

  publish-hydration-parity:
    name: Publish hydration parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Reproduce deploy publish-hydration
        # NFR-011: mirror deploy-site.yml by hydrating the same generated content
        # set from the canonical publish branch, so main/publish divergence fails
        # CI here rather than in the production deploy (issues #627, #644).
        run: |
          set -euo pipefail
          git fetch origin publish
          # Capture into a var first: process substitution does not fail under set -e.
          GENERATED_PATHS="$(python3 -m scripts.publish_hydration paths)"
          while IFS= read -r path; do
            path="${path%/}"
            [ -z "$path" ] && continue
            if [ -n "$(git ls-tree -r --name-only origin/publish -- "$path")" ]; then
              rm -rf "$path"
              git checkout origin/publish -- "$path"
            fi
          done <<< "$GENERATED_PATHS"

      - name: Validate hydrated references (NFR-011 / NFR-012)
        run: python3 -m scripts.publish_hydration check

  production-site:
    name: Production site
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.161.1
      PAGEFIND_VERSION: 1.5.2
      PLAYWRIGHT_VERSION: 1.54.2
      AXE_PLAYWRIGHT_VERSION: 4.10.2
      LIGHTHOUSE_VERSION: 12.8.2
      BASE_URL: http://127.0.0.1:1313
      HUGO_PARAMS_GA_MEASUREMENT_ID: G-TEST-OBSERVATORY

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Initialize theme submodule (with retry)
        # PaperMod is a public https submodule; retry to survive transient clone 5xx.
        run: |
          set -euo pipefail
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if git submodule update --init --recursive -- themes/PaperMod; then
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::PaperMod submodule init failed (attempt ${attempt}/${attempts}); retrying in $((attempt * 10))s" >&2
              sleep "$((attempt * 10))"
            fi
          done
          echo "::error::PaperMod submodule initialization failed after ${attempts} attempts" >&2
          exit 1

      - name: Install Hugo
        run: | # zizmor: ignore[github-env] writes a fixed runner path (${HOME}/.local/hugo) to GITHUB_PATH; needed so later steps can run hugo
          set -euo pipefail
          RELEASE_URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          TARBALL="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          CHECKSUM_FILE="hugo_${HUGO_VERSION}_checksums.txt"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-max-time 300 --retry-all-errors \
            --output "${TARBALL}" "${RELEASE_URL}/${TARBALL}"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-max-time 300 --retry-all-errors \
            --output "${CHECKSUM_FILE}" "${RELEASE_URL}/${CHECKSUM_FILE}"
          checksum_line="$(awk -v file="${TARBALL}" '$NF == file {print; found=1} END {if (!found) exit 1}' "${CHECKSUM_FILE}")" || {
            echo "Error: No checksum entry for ${TARBALL} found in ${CHECKSUM_FILE}" >&2
            exit 1
          }
          if ! printf '%s\n' "${checksum_line}" | sha256sum --check; then
            echo "Error: Checksum verification failed for ${TARBALL}" >&2
            exit 1
          fi
          rm "${CHECKSUM_FILE}"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${TARBALL}"
          rm "${TARBALL}"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/hugo:${PATH}"
          hugo version

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Run Node unit tests
        run: node --test tests/*.test.mjs

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install production test dependencies
        run: | # zizmor: ignore[adhoc-packages] Phase 7 pins each browser test package; the plan excludes adding a Node manifest.
          set -euo pipefail
          python -m pip install --upgrade pytest -r requirements.txt
          npm install --no-save --no-package-lock \
            "@playwright/test@${PLAYWRIGHT_VERSION}" \
            "@axe-core/playwright@${AXE_PLAYWRIGHT_VERSION}" \
            "lighthouse@${LIGHTHOUSE_VERSION}"
          npx --no-install playwright install --with-deps chromium

      - name: Validate embed source pages
        run: python scripts/check_embed_sources.py

      - name: Build site and capture Hugo duration
        id: hugo-build
        run: |
          set -euo pipefail
          started_at="$(date +%s%N)"
          hugo --minify --baseURL "${BASE_URL}/"
          finished_at="$(date +%s%N)"
          echo "duration_ms=$(( (finished_at - started_at) / 1000000 ))" >> "${GITHUB_OUTPUT}"

      - name: Build Pagefind index and capture duration
        id: pagefind-build
        run: |
          set -euo pipefail
          started_at="$(date +%s%N)"
          npx "pagefind@${PAGEFIND_VERSION}" --site public/
          finished_at="$(date +%s%N)"
          echo "duration_ms=$(( (finished_at - started_at) / 1000000 ))" >> "${GITHUB_OUTPUT}"

      - name: Write build timing and enforce budgets
        env:
          COMMIT_SHA: ${{ github.sha }}
          HUGO_DURATION_MS: ${{ steps.hugo-build.outputs.duration_ms }}
          PAGEFIND_DURATION_MS: ${{ steps.pagefind-build.outputs.duration_ms }}
          HUGO_BUDGET_MS: '6000'
          PAGEFIND_BUDGET_MS: '5500'
          TOTAL_BUDGET_MS: '11500'
        run: |
          set -euo pipefail
          mkdir -p reports
          total_ms=$(( HUGO_DURATION_MS + PAGEFIND_DURATION_MS ))
          printf '{\n  "commit": "%s",\n  "mode": "blocking",\n  "hugo": {"version": "%s", "duration_ms": %s, "budget_ms": %s},\n  "pagefind": {"version": "%s", "duration_ms": %s, "budget_ms": %s},\n  "total_ms": %s,\n  "blocking_threshold_ms": %s\n}\n' \
            "${COMMIT_SHA}" "${HUGO_VERSION}" "${HUGO_DURATION_MS}" "${HUGO_BUDGET_MS}" \
            "${PAGEFIND_VERSION}" "${PAGEFIND_DURATION_MS}" "${PAGEFIND_BUDGET_MS}" \
            "${total_ms}" "${TOTAL_BUDGET_MS}" > reports/build-timing.json
          fail=0
          if [ "${HUGO_DURATION_MS}" -gt "${HUGO_BUDGET_MS}" ]; then
            echo "::error::Hugo build ${HUGO_DURATION_MS}ms exceeds budget ${HUGO_BUDGET_MS}ms"; fail=1
          fi
          if [ "${PAGEFIND_DURATION_MS}" -gt "${PAGEFIND_BUDGET_MS}" ]; then
            echo "::error::Pagefind index ${PAGEFIND_DURATION_MS}ms exceeds budget ${PAGEFIND_BUDGET_MS}ms"; fail=1
          fi
          if [ "${total_ms}" -gt "${TOTAL_BUDGET_MS}" ]; then
            echo "::error::Total build ${total_ms}ms exceeds budget ${TOTAL_BUDGET_MS}ms"; fail=1
          fi
          [ "${fail}" -eq 0 ] || exit 1

      - name: Run rendered SEO and link contracts
        run: |
          python -m pytest \
            tests/test_rendered_seo_metadata.py \
            tests/test_rendered_weekly_links.py \
            tests/test_internal_link_checker.py \
            tests/test_topic_hubs.py

      - name: Check internal links
        run: python scripts/check_internal_links.py public --base-url "https://claracle.com/"

      - name: Serve production build
        run: |
          set -euo pipefail
          python scripts/serve_static.py --directory public --bind 127.0.0.1 --port 1313 > reports/site-server.log 2>&1 &
          echo $! > reports/site-server.pid
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused "${BASE_URL}/" > /dev/null

      - name: Run axe and responsive browser gates
        run: npx --no-install playwright test --config tests/visual/playwright.config.mjs tests/visual/a11y-perf.spec.mjs tests/visual/observatory-a11y.spec.mjs tests/visual/observatory-analytics.spec.mjs tests/visual/ranking-explorer.spec.mjs

      - name: Run Lighthouse gates
        run: node scripts/design/lighthouse-gates.mjs --base "${BASE_URL}"

      # Runs last so evidence collection never perturbs the gates above, and
      # because Lighthouse launches its own Chrome and wants an unloaded runner.
      # This spec is both a gate and the evidence producer: it asserts breadcrumb
      # structure and horizontal overflow, and it writes the review matrix. It runs
      # even after an earlier gate fails, because a failing build is exactly when
      # the visual evidence is most worth having.
      - name: Run visual structure gate and capture evidence
        if: ${{ !cancelled() }}
        env:
          # Keep the axe, analytics, and Lighthouse reports from being overwritten.
          PLAYWRIGHT_REPORT_SUFFIX: -visual
        run: npx --no-install playwright test --config tests/visual/playwright.config.mjs tests/visual/observatory-visual-regression.spec.mjs

      - name: Build visual evidence review index
        if: ${{ !cancelled() }}
        run: python scripts/design/build_visual_evidence_index.py

      - name: Upload production quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: production-quality-reports
          path: |
            reports/build-timing.json
            reports/site-server.log
            screenshots/lighthouse-results/
            screenshots/playwright-output*/
            screenshots/playwright-report*.json
            screenshots/playwright-report*/
            screenshots/visual-regression/
          retention-days: 30
          if-no-files-found: warn
