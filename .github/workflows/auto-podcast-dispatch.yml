name: Auto-dispatch podcast after weekly article

# Trigger: sync-publish-to-main workflow completes (articles land on main via
#   GITHUB_TOKEN squash-merge; the push event is suppressed for that actor so
#   a push: trigger would never fire in normal operation).
# Guard: concurrency group prevents overlapping runs.
# Gate: podcaster-real-generation environment requires human approval.
# Pause: set PODCAST_AUTO_DISPATCH_PAUSED repo variable to 'true' to defer.
# Recovery: workflow_dispatch with observe_only=true for rollout validation.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] chained off sync-publish-to-main; detection is fail-closed on SHA-256 manifest correlation
    workflows: ["Sync publish data to main"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7:Auto-dispatch workflow reads trusted machine-generated publish evidence; correlation uses article SHA-256, not user-controlled text.
    inputs:
      week:
        description: 'Override: week slug for observe-only recovery (e.g. 2026-W37)'
        required: false
        type: string
      observe_only:
        description: 'Observe only — validate but do not call Podcaster'
        type: boolean
        default: false

run-name: "Auto-dispatch${{ inputs.observe_only == true && ' (observe-only)' || '' }}: ${{ inputs.week || github.ref_name }}"

permissions:
  contents: read

# Single global group: only one auto-dispatch runs at a time.
# cancel-in-progress: false ensures a dispatch is never silently dropped.
concurrency:
  group: auto-podcast-dispatch
  cancel-in-progress: false

jobs:

  detect:
    name: Detect eligible weekly publication
    runs-on: ubuntu-latest
    # For workflow_run: only proceed when the triggering sync completed successfully.
    # For workflow_dispatch: always proceed (manual recovery / observe-only validation).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      eligible: ${{ steps.detect.outputs.eligible }}
      week: ${{ steps.detect.outputs.week }}
      publish_run_id: ${{ steps.detect.outputs.publish_run_id }}
      manifest_path: ${{ steps.detect.outputs.manifest_path }}
      article_path: ${{ steps.detect.outputs.article_path }}
      article_url: ${{ steps.detect.outputs.article_url }}
      article_sha256: ${{ steps.detect.outputs.article_sha256 }}
      manifest_sha256: ${{ steps.detect.outputs.manifest_sha256 }}
      identity_key: ${{ steps.detect.outputs.identity_key }}
      is_duplicate: ${{ steps.dedup.outputs.is_duplicate }}
      dedup_status: ${{ steps.dedup.outputs.dedup_status }}
      prior_run_url: ${{ steps.dedup.outputs.prior_run_url }}
      dispatch_status: ${{ steps.detect.outputs.status }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: main  # always HEAD of main; github.sha for workflow_run is the triggering workflow's SHA, not post-merge HEAD
          fetch-depth: 0  # Full history needed to locate sync commit by message (race-safe)
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Detect eligible manifest
        id: detect
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # GITHUB_SHA for workflow_run is the triggering workflow's SHA, not post-merge HEAD.
          # Always use git rev-parse HEAD (resolved after checkout ref: main above).
          GITHUB_SHA: ''
          WEEK_OVERRIDE: ${{ inputs.week || '' }}
          OBSERVE_ONLY: ${{ inputs.observe_only == true && 'true' || '' }}
          PODCAST_AUTO_DISPATCH_PAUSED: ${{ vars.PODCAST_AUTO_DISPATCH_PAUSED || '' }}
        run: |
          set -euo pipefail

          # Resolve HEAD after checkout (correct for both push and workflow_run)
          GITHUB_SHA=$(git rev-parse HEAD)

          OBSERVE_ONLY_FLAG=""
          if [ "$OBSERVE_ONLY" = "true" ]; then
            OBSERVE_ONLY_FLAG="--observe-only"
          fi

          if [ -n "$WEEK_OVERRIDE" ]; then
            # Manual override for observe-only recovery (workflow_dispatch).
            # Validate week format before constructing path.
            if [[ ! "$WEEK_OVERRIDE" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
              echo "::error::week override must match YYYY-WNN (got: $WEEK_OVERRIDE)"
              exit 1
            fi
            YEAR="${WEEK_OVERRIDE%%-*}"
            SHORT="${WEEK_OVERRIDE##*-}"
            ARTICLE_PATH="content/weekly/${YEAR}/${SHORT}.md"
            python3 scripts/auto_dispatch_detect.py \
              --article-path "$ARTICLE_PATH" \
              --current-sha "$GITHUB_SHA" \
              ${OBSERVE_ONLY_FLAG}
          else
            # For workflow_run path: use the triggering run's head_sha as anchor.
            # This durable binding prevents picking up a later unrelated sync commit.
            if [ -n "$WORKFLOW_RUN_HEAD_SHA" ]; then
              SYNC_SHA=$(python3 scripts/auto_dispatch_detect.py --find-sync-commit "$WORKFLOW_RUN_HEAD_SHA")
            else
              # workflow_run path without anchor SHA: fail-closed (no safe way to correlate the triggering sync).
              # Use workflow_dispatch with week= input for manual recovery instead.
              echo "::error::No WORKFLOW_RUN_HEAD_SHA and no WEEK_OVERRIDE; cannot safely determine sync commit. Use workflow_dispatch with week= input for manual recovery."
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "status=no_anchor" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ -z "$SYNC_SHA" ]; then
              echo "::notice::No 'sync: publish data' commit found after workflow_run anchor; nothing to dispatch."
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "status=no_new_article" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "  sync commit: $SYNC_SHA"
            BEFORE_REF="${SYNC_SHA}^1"
            ARTICLE_RANGE_END="$SYNC_SHA"

            NEW_ARTICLES=$(git diff --name-only --diff-filter=A "$BEFORE_REF" "$ARTICLE_RANGE_END" \
              -- 'content/weekly/**/*.md' 2>/dev/null || true)

            if [ -z "$NEW_ARTICLES" ]; then
              echo "No new weekly articles detected in this push."
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "status=no_new_article" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ARTICLE_COUNT=$(echo "$NEW_ARTICLES" | wc -l | tr -d ' ')
            echo "  Detected ${ARTICLE_COUNT} new weekly article(s)."

            # Fail-closed if multiple articles added in one push — each weekly publish
            # commits exactly one article; multiple is unexpected and could overwrite outputs.
            if [ "$ARTICLE_COUNT" -gt 1 ]; then
              echo "::error::Multiple new weekly articles detected in one push (${ARTICLE_COUNT}). Expected exactly one per publish transaction. Commit them separately or dispatch manually."
              exit 1
            fi

            # Run detection for the single new article
            while IFS= read -r article_path; do
              [ -z "$article_path" ] && continue
              python3 scripts/auto_dispatch_detect.py \
                --article-path "$article_path" \
                --before-sha "$BEFORE_REF" \
                --current-sha "$ARTICLE_RANGE_END" \
                ${OBSERVE_ONLY_FLAG}
            done <<< "$NEW_ARTICLES"
          fi

      - name: Check for duplicate dispatch
        id: dedup
        if: steps.detect.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WEEK: ${{ steps.detect.outputs.week }}
          PUBLISH_RUN_ID: ${{ steps.detect.outputs.publish_run_id }}
          ARTICLE_SHA256: ${{ steps.detect.outputs.article_sha256 }}
          MANIFEST_SHA256: ${{ steps.detect.outputs.manifest_sha256 }}
        run: |
          python3 scripts/auto_dispatch_detect.py \
            --check-duplicate \
            --week "$WEEK" \
            --publish-run-id "$PUBLISH_RUN_ID" \
            --article-sha256 "$ARTICLE_SHA256" \
            --manifest-sha256 "$MANIFEST_SHA256"

      - name: Emit detect receipt
        if: always()
        env:
          DETECT_STATUS: ${{ steps.detect.outputs.status }}
          ELIGIBLE: ${{ steps.detect.outputs.eligible }}
          WEEK: ${{ steps.detect.outputs.week }}
          PUBLISH_RUN_ID: ${{ steps.detect.outputs.publish_run_id }}
          ARTICLE_SHA256: ${{ steps.detect.outputs.article_sha256 }}
          MANIFEST_SHA256: ${{ steps.detect.outputs.manifest_sha256 }}
          DEDUP_STATUS: ${{ steps.dedup.outputs.dedup_status }}
          PRIOR_RUN_URL: ${{ steps.dedup.outputs.prior_run_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os

          detect_status = os.environ.get("DETECT_STATUS", "").strip()
          dedup_status = os.environ.get("DEDUP_STATUS", "").strip()
          eligible = os.environ.get("ELIGIBLE", "").strip()

          receipt_state = ""
          if dedup_status == "duplicate":
              receipt_state = "duplicate_prevented"
          elif dedup_status == "ambiguous_prior_submission":
              receipt_state = "ambiguous_prior_submission"
          elif detect_status and detect_status != "eligible":
              receipt_state = detect_status

          if not receipt_state:
              raise SystemExit(0)

          record = {
              "schema_version": "podcast_dispatch_receipt_v1",
              "workflow": "auto-podcast-dispatch",
              "receipt_state": receipt_state,
              "week": os.environ.get("WEEK", "").strip(),
              "publish_run_id": os.environ.get("PUBLISH_RUN_ID", "").strip(),
              "article_sha256": os.environ.get("ARTICLE_SHA256", "").strip(),
              "manifest_sha256": os.environ.get("MANIFEST_SHA256", "").strip(),
              "prior_run_url": os.environ.get("PRIOR_RUN_URL", "").strip(),
              "actions_run_url": os.environ.get("RUN_URL", "").strip(),
          }
          print(f"PODCAST_DISPATCH_RECEIPT::{json.dumps(record, sort_keys=True, separators=(',', ':'))}")
          PY

      - name: Record paused/deferred notice
        if: steps.detect.outputs.status == 'paused'
        run: |
          echo "::notice::Auto-dispatch paused by PODCAST_AUTO_DISPATCH_PAUSED variable. Publication is deferred."
          {
            echo "## ⏸️ Podcast dispatch deferred"
            echo ""
            echo "- **Reason:** \`PODCAST_AUTO_DISPATCH_PAUSED\` repo variable is set to \`true\`"
            echo "- **Recovery:** Clear the variable and re-run this workflow with \`observe_only=true\` to verify, then with \`observe_only=false\` to dispatch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record ambiguous prior dispatch notice
        if: always() && steps.dedup.outputs.dedup_status == 'ambiguous_prior_submission'
        env:
          PRIOR_RUN_URL: ${{ steps.dedup.outputs.prior_run_url || 'unknown' }}
          WEEK: ${{ steps.detect.outputs.week }}
          PUBLISH_RUN_ID: ${{ steps.detect.outputs.publish_run_id }}
          ARTICLE_SHA256: ${{ steps.detect.outputs.article_sha256 }}
          MANIFEST_SHA256: ${{ steps.detect.outputs.manifest_sha256 }}
        run: |
          {
            echo "## ⚠️ Podcast dispatch blocked by ambiguous prior submission"
            echo ""
            echo "- **Reason:** prior real-dispatch evidence could not be proven safe to retry"
            echo "- **Prior run:** ${PRIOR_RUN_URL}"
            echo "- **Week:** ${WEEK}"
            echo "- **Publish run ID:** ${PUBLISH_RUN_ID}"
            echo "- **Article SHA-256:** \`${ARTICLE_SHA256}\`"
            echo "- **Manifest SHA-256:** \`${MANIFEST_SHA256}\`"
            echo ""
            echo "Manual review is required before any retry."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record no-match notice
        if: steps.detect.outputs.eligible == 'false' && steps.detect.outputs.status != 'paused' && steps.detect.outputs.status != 'no_new_article'
        env:
          NO_MATCH_REASON: ${{ steps.detect.outputs.reason || 'no_matching_manifest' }}
        run: |
          {
            echo "## ⚠️ Podcast auto-dispatch: no eligible manifest found"
            echo ""
            echo "- **Reason:** \`${NO_MATCH_REASON}\`"
            echo "- **Push SHA:** \`${{ github.sha }}\`"
            echo ""
            echo "If publication should have triggered a podcast, check that:"
            echo "1. The crawl-and-publish run completed successfully"
            echo "2. A publish manifest exists on the \`publish\` branch for this week"
            echo "3. The manifest \`candidate.content_sha256\` matches the merged article"
            echo ""
            echo "Use workflow_dispatch with \`observe_only=true\` and a \`week\` override for manual recovery."
          } >> "$GITHUB_STEP_SUMMARY"

  real-generation:
    name: Protected podcast dispatch
    needs: detect
    # Defense-in-depth: only proceed when detection confirmed eligibility,
    # dedup found no prior dispatch, and this is not an observe-only run.
    # The github.ref guard mirrors trigger-podcast.yml: environment secrets
    # are only reachable from a workflow executed on main.
    if: |
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.eligible == 'true' &&
      needs.detect.outputs.is_duplicate != 'true' &&
      inputs.observe_only != true
    runs-on: ubuntu-latest
    concurrency:
      group: podcast-dispatch-${{ needs.detect.outputs.identity_key }}
      cancel-in-progress: false
    environment:
      name: podcaster-real-generation
    permissions:
      contents: read
      actions: read
      issues: write
    outputs:
      handoff_entered: ${{ steps.handoff-boundary.outcome == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Derive and validate paths from detection outputs
        id: derive
        env:
          WEEK: ${{ needs.detect.outputs.week }}
          ARTICLE_PATH: ${{ needs.detect.outputs.article_path }}
          ARTICLE_URL: ${{ needs.detect.outputs.article_url }}
        run: |
          set -euo pipefail
          # Validate machine-generated week slug before use in shell
          if [[ ! "$WEEK" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo "::error::week must match YYYY-WNN (got: $WEEK)"
            exit 1
          fi
          # Validate article path format
          if [[ ! "$ARTICLE_PATH" =~ ^content/weekly/[0-9]{4}/W[0-9]{2}\.md$ ]]; then
            echo "::error::article_path has unexpected format (got: $ARTICLE_PATH)"
            exit 1
          fi
          echo "article_path=${ARTICLE_PATH}" >> "$GITHUB_OUTPUT"
          echo "article_url=${ARTICLE_URL}" >> "$GITHUB_OUTPUT"

      - name: Locate publish manifest from detection
        id: manifest-locate
        env:
          WEEK: ${{ needs.detect.outputs.week }}
          PUBLISH_RUN_ID: ${{ needs.detect.outputs.publish_run_id }}
          DETECT_MANIFEST_PATH: ${{ needs.detect.outputs.manifest_path }}
          DETECT_ARTICLE_SHA256: ${{ needs.detect.outputs.article_sha256 }}
          DETECT_MANIFEST_SHA256: ${{ needs.detect.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          if ! [[ "$PUBLISH_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::publish_run_id must be a numeric workflow run ID (got: $PUBLISH_RUN_ID)"
            exit 1
          fi
          # Validate manifest path format (defense-in-depth; also checked in detect script)
          if ! echo "$DETECT_MANIFEST_PATH" | grep -qE \
            '^data/candidates/[^/]+/[^/]+/publish-manifest\.json$'; then
            echo "::error::manifest_path has unexpected format (got: $DETECT_MANIFEST_PATH)"
            exit 1
          fi
          if ! git fetch origin publish 2>/dev/null; then
            echo "::error::Could not fetch publish branch. Has crawl-and-publish run yet?"
            exit 1
          fi
          MANIFEST="data/candidates/${WEEK}/${PUBLISH_RUN_ID}/publish-manifest.json"
          # Verify exact path matches detection output
          if [ "$MANIFEST" != "$DETECT_MANIFEST_PATH" ]; then
            echo "::error::manifest path mismatch: expected $DETECT_MANIFEST_PATH got $MANIFEST"
            exit 1
          fi
          if ! git checkout origin/publish -- "$MANIFEST" 2>/dev/null; then
            echo "::error::Manifest not found at $MANIFEST for exact run $PUBLISH_RUN_ID"
            exit 1
          fi
          # Mirror trigger-podcast.yml validation inline Python
          python3 - "$MANIFEST" "$WEEK" "$PUBLISH_RUN_ID" "$DETECT_ARTICLE_SHA256" "$DETECT_MANIFEST_SHA256" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          requested_week = sys.argv[2]
          requested_run_id = sys.argv[3]
          expected_article_sha256 = sys.argv[4]
          expected_manifest_sha256 = sys.argv[5]
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          if manifest.get("week") != requested_week:
              raise SystemExit(f"::error::Manifest week {manifest.get('week')!r} != {requested_week!r}")
          if str(manifest.get("run_id")) != requested_run_id:
              raise SystemExit(f"::error::Manifest run_id {manifest.get('run_id')!r} != {requested_run_id!r}")
          if manifest.get("run_mode") != "normal":
              raise SystemExit(f"::error::Manifest run_mode is not 'normal': {manifest.get('run_mode')!r}")

          analysis = manifest.get("analysis") or {}
          preflight = analysis.get("preflight") or {}
          if not preflight.get("publish_eligible"):
              raise SystemExit("::error::analysis.preflight.publish_eligible is not true")
          if not manifest.get("promotion_eligible"):
              raise SystemExit("::error::promotion_eligible is not true")

          candidate = manifest.get("candidate") or {}
          article_sha256 = candidate.get("content_sha256")
          if not isinstance(article_sha256, str) or len(article_sha256) != 64:
              raise SystemExit("::error::Manifest candidate.content_sha256 is missing or invalid")
          if article_sha256 != expected_article_sha256:
              raise SystemExit(
                  f"::error::SHA-256 mismatch: manifest={article_sha256!r} detect={expected_article_sha256!r}"
              )

          manifest_sha256 = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          if manifest_sha256 != expected_manifest_sha256:
              raise SystemExit(
                  f"::error::Manifest SHA-256 mismatch: fetched={manifest_sha256!r} "
                  f"detect={expected_manifest_sha256!r}"
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"manifest_path={manifest_path}\n")
              out.write(f"manifest_sha256={manifest_sha256}\n")
              out.write(f"article_sha256={article_sha256}\n")
              out.write(f"publish_run_id={requested_run_id}\n")
          PY

      - name: Validate Podcaster configuration
        env:
          PODCASTER_ENDPOINT: ${{ vars.PODCASTER_ENDPOINT }}
          PODCASTER_API_KEY: ${{ secrets.PODCASTER_API_KEY }}
        run: |
          if [ -z "$PODCASTER_ENDPOINT" ] || [ -z "$PODCASTER_API_KEY" ]; then
            echo "::error::Requires PODCASTER_ENDPOINT variable and PODCASTER_API_KEY secret."
            exit 1
          fi

      - name: Prepare mutation receipt
        id: prepare-receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WEEK: ${{ needs.detect.outputs.week }}
          PUBLISH_RUN_ID: ${{ needs.detect.outputs.publish_run_id }}
          ARTICLE_SHA256: ${{ steps.manifest-locate.outputs.article_sha256 }}
          MANIFEST_SHA256: ${{ steps.manifest-locate.outputs.manifest_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/podcast_dispatch_state.py write-receipt \
            --state attempt_prepared \
            --dispatch-run-id "${{ github.run_id }}" \
            --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --week "$WEEK" --publish-run-id "$PUBLISH_RUN_ID" \
            --article-sha256 "$ARTICLE_SHA256" --manifest-sha256 "$MANIFEST_SHA256" \
            --actions-run-url "$RUN_URL" --output podcast-dispatch-pre-receipt.json

      - name: Persist prepared receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          from scripts.podcast_dispatch_state import append_ledger_receipt, parse_receipt
          receipt = parse_receipt(open("podcast-dispatch-pre-receipt.json", encoding="utf-8").read())
          append_ledger_receipt(os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"], receipt)
          PY

      - name: Mirror prepared receipt
        id: mirror-pre
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: podcast-dispatch-pre-receipt
          path: podcast-dispatch-pre-receipt.json
          retention-days: 90

      - name: Record pre-submit mirror failure
        if: steps.mirror-pre.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WEEK: ${{ needs.detect.outputs.week }}
          PUBLISH_RUN_ID: ${{ needs.detect.outputs.publish_run_id }}
          ARTICLE_SHA256: ${{ steps.manifest-locate.outputs.article_sha256 }}
          MANIFEST_SHA256: ${{ steps.manifest-locate.outputs.manifest_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/podcast_dispatch_state.py write-receipt \
            --state pre_submit_failed --dispatch-run-id "${{ github.run_id }}" \
            --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --week "$WEEK" --publish-run-id "$PUBLISH_RUN_ID" \
            --article-sha256 "$ARTICLE_SHA256" --manifest-sha256 "$MANIFEST_SHA256" \
            --actions-run-url "$RUN_URL" --output podcast-dispatch-pre-receipt.json \
            --append-ledger
          exit 1

      - name: Persist handoff-entered boundary
        id: handoff-boundary
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WEEK: ${{ needs.detect.outputs.week }}
          PUBLISH_RUN_ID: ${{ needs.detect.outputs.publish_run_id }}
          ARTICLE_SHA256: ${{ steps.manifest-locate.outputs.article_sha256 }}
          MANIFEST_SHA256: ${{ steps.manifest-locate.outputs.manifest_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/podcast_dispatch_state.py write-receipt \
            --state handoff_entered --dispatch-run-id "${{ github.run_id }}" \
            --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --week "$WEEK" --publish-run-id "$PUBLISH_RUN_ID" \
            --article-sha256 "$ARTICLE_SHA256" --manifest-sha256 "$MANIFEST_SHA256" \
            --actions-run-url "$RUN_URL" --output podcast-dispatch-pre-receipt.json \
            --append-ledger

      - name: Trigger podcast generation
        id: handoff
        continue-on-error: true
        env:
          PODCASTER_ENDPOINT: ${{ vars.PODCASTER_ENDPOINT }}
          PODCASTER_API_KEY: ${{ secrets.PODCASTER_API_KEY }}
          WEEK: ${{ needs.detect.outputs.week }}
          ARTICLE_URL: ${{ steps.derive.outputs.article_url }}
          ARTICLE_PATH: ${{ steps.derive.outputs.article_path }}
          MANIFEST_FILE: ${{ steps.manifest-locate.outputs.manifest_path }}
          PUBLISH_RUN_ID: ${{ steps.manifest-locate.outputs.publish_run_id }}
          TRIGGER_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f "$ARTICLE_PATH" ]; then
            echo "::error::Article '$ARTICLE_PATH' is not on the default branch."
            exit 1
          fi
          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "::error::Manifest file not found: $MANIFEST_FILE"
            exit 1
          fi

          python3 scripts/podcaster_handoff.py \
            --week "$WEEK" \
            --article-url "$ARTICLE_URL" \
            --article-path "$ARTICLE_PATH" \
            --publish-run-id "$PUBLISH_RUN_ID" \
            --publish-mode normal \
            --manifest "$MANIFEST_FILE" \
            --podcast-config config/podcast.json \
            --require-merged

      - name: Persist post receipt to ledger
        id: post-ledger
        if: always() && steps.handoff-boundary.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PODCASTER_JOB_ID: ${{ steps.handoff.outputs.podcaster_job_id }}
          PODCASTER_RECEIPT_STATE: ${{ steps.handoff.outputs.podcaster_receipt_state }}
          PODCASTER_STATUS: ${{ steps.handoff.outputs.podcaster_status }}
          PODCASTER_HTTP_STATUS: ${{ steps.handoff.outputs.podcaster_http_status }}
          PODCASTER_API_STATUS_CATEGORY: ${{ steps.handoff.outputs.podcaster_api_status_category }}
          PODCASTER_CORRELATION_ID: ${{ steps.handoff.outputs.podcaster_correlation_id }}
          WEEK: ${{ needs.detect.outputs.week }}
          PUBLISH_RUN_ID: ${{ needs.detect.outputs.publish_run_id }}
          MANIFEST_PATH: ${{ steps.manifest-locate.outputs.manifest_path }}
          MANIFEST_SHA256: ${{ steps.manifest-locate.outputs.manifest_sha256 || needs.detect.outputs.manifest_sha256 }}
          ARTICLE_PATH: ${{ steps.derive.outputs.article_path }}
          ARTICLE_SHA256: ${{ steps.manifest-locate.outputs.article_sha256 || needs.detect.outputs.article_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATE="${PODCASTER_RECEIPT_STATE:-submission_unknown}"
          [ "$STATE" = "submitted" ] && STATE="accepted"
          ARGS=()
          [ -n "$PODCASTER_HTTP_STATUS" ] && ARGS+=(--api-status "$PODCASTER_HTTP_STATUS")
          [ -n "$PODCASTER_API_STATUS_CATEGORY" ] && ARGS+=(--api-status-category "$PODCASTER_API_STATUS_CATEGORY")
          [ -n "$PODCASTER_JOB_ID" ] && ARGS+=(--job-id "$PODCASTER_JOB_ID")
          [ -n "$PODCASTER_CORRELATION_ID" ] && ARGS+=(--correlation-id "$PODCASTER_CORRELATION_ID")
          python3 scripts/podcast_dispatch_state.py write-receipt \
            --state "$STATE" --dispatch-run-id "${{ github.run_id }}" \
            --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --week "$WEEK" --publish-run-id "$PUBLISH_RUN_ID" \
            --article-sha256 "$ARTICLE_SHA256" --manifest-sha256 "$MANIFEST_SHA256" \
            --actions-run-url "$RUN_URL" --output podcast-dispatch-post-receipt.json \
            --append-ledger "${ARGS[@]}"

      - name: Upload post receipt mirror
        id: post-artifact
        if: always() && steps.handoff-boundary.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: podcast-dispatch-post-receipt
          path: podcast-dispatch-post-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Assert post persistence
        if: always() && steps.handoff-boundary.outcome == 'success'
        env:
          HANDOFF_OUTCOME: ${{ steps.handoff.outcome }}
          LEDGER_OUTCOME: ${{ steps.post-ledger.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.post-artifact.outcome }}
        run: |
          if [ "$HANDOFF_OUTCOME" != "success" ] || [ "$LEDGER_OUTCOME" != "success" ] || [ "$ARTIFACT_OUTCOME" != "success" ]; then
            echo "::error::Handoff or required post persistence failed; reconciliation remains required."
            exit 1
          fi

  observe-summary:
    name: Observe-only summary
    needs: detect
    if: |
      needs.detect.outputs.eligible == 'true' &&
      inputs.observe_only == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Persist observation receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WEEK: ${{ needs.detect.outputs.week }}
          PUBLISH_RUN_ID: ${{ needs.detect.outputs.publish_run_id }}
          ARTICLE_SHA256: ${{ needs.detect.outputs.article_sha256 }}
          MANIFEST_SHA256: ${{ needs.detect.outputs.manifest_sha256 }}
        run: |
          python3 scripts/podcast_dispatch_state.py write-receipt \
            --state observation_only --dispatch-run-id "${{ github.run_id }}" \
            --attempt-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --week "$WEEK" \
            --publish-run-id "$PUBLISH_RUN_ID" \
            --article-sha256 "$ARTICLE_SHA256" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --actions-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output podcast-dispatch-observation.json --append-ledger
      - name: Upload observation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: podcast-dispatch-observation
          path: podcast-dispatch-observation.json
          retention-days: 90
      - name: Record observe-only result
        env:
          WEEK: ${{ needs.detect.outputs.week }}
          PUBLISH_RUN_ID: ${{ needs.detect.outputs.publish_run_id }}
          ARTICLE_PATH: ${{ needs.detect.outputs.article_path }}
          ARTICLE_SHA256: ${{ needs.detect.outputs.article_sha256 }}
          MANIFEST_PATH: ${{ needs.detect.outputs.manifest_path }}
          MANIFEST_SHA256: ${{ needs.detect.outputs.manifest_sha256 }}
        run: |
          {
            echo "## 👁️ Observe-only: podcast dispatch would have been created"
            echo ""
            echo "- **Week:** ${WEEK}"
            echo "- **Publish run ID:** ${PUBLISH_RUN_ID}"
            echo "- **Article:** \`${ARTICLE_PATH}\`"
            echo "- **Article SHA-256:** \`${ARTICLE_SHA256}\`"
            echo "- **Manifest:** \`${MANIFEST_PATH}\`"
            echo "- **Manifest SHA-256:** \`${MANIFEST_SHA256}\`"
            echo "- **Would have dispatched to:** podcaster-real-generation environment"
            echo ""
            echo "_No Podcaster request was sent. This is an observe-only run._"
          } >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    name: Reconcile podcast publication
    needs: [detect, real-generation]
    if: |
      always() &&
      inputs.observe_only != true &&
      (needs.detect.outputs.dedup_status == 'ambiguous_prior_submission' ||
       needs.real-generation.outputs.handoff_entered == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 61
    permissions:
      actions: read
      contents: read
      issues: write
    environment:
      name: podcaster-real-generation
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false
      - name: Download post receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: podcast-dispatch-post-receipt
      - name: Resolve authoritative ledger receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISPATCH_RUN_ID: ${{ github.run_id }}
          WEEK: ${{ needs.detect.outputs.week }}
          PUBLISH_RUN_ID: ${{ needs.detect.outputs.publish_run_id }}
          ARTICLE_SHA256: ${{ needs.detect.outputs.article_sha256 }}
          MANIFEST_SHA256: ${{ needs.detect.outputs.manifest_sha256 }}
        run: |
          set +e
          python3 scripts/podcast_dispatch_state.py resolve-receipt \
            --week "$WEEK" \
            --publish-run-id "$PUBLISH_RUN_ID" \
            --article-sha256 "$ARTICLE_SHA256" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
            --output podcast-dispatch-authoritative-receipt.json
          resolve_status=$?
          set -e
          if [ "$resolve_status" -ne 0 ]; then
            state="unavailable"
            [ "$resolve_status" -eq 2 ] && state="missing"
            python3 scripts/podcast_dispatch_state.py upsert-incident \
              --week "$WEEK" \
              --publish-run-id "$PUBLISH_RUN_ID" \
              --article-sha256 "$ARTICLE_SHA256" \
              --manifest-sha256 "$MANIFEST_SHA256" \
              --stage ledger --state "$state" \
              --repo "$GITHUB_REPOSITORY" --token "$GH_TOKEN" \
              --dispatch-run-id "$DISPATCH_RUN_ID"
            echo "::error::Authoritative ledger receipt could not be resolved."
            exit 1
          fi
          if [ -f podcast-dispatch-post-receipt.json ]; then
            python3 - <<'PY'
          from pathlib import Path
          from scripts.podcast_dispatch_state import DispatchReceipt, parse_receipt

          authoritative = parse_receipt(
              Path("podcast-dispatch-authoritative-receipt.json").read_text(encoding="utf-8")
          )
          diagnostic = parse_receipt(
              Path("podcast-dispatch-post-receipt.json").read_text(encoding="utf-8")
          )
          if not isinstance(authoritative, DispatchReceipt):
              raise SystemExit("authoritative receipt is not v2")
          if not isinstance(diagnostic, DispatchReceipt):
              raise SystemExit("diagnostic receipt is not v2")
          if (
              diagnostic.identity != authoritative.identity
              or diagnostic.attempt_id != authoritative.attempt_id
              or diagnostic.receipt_state != authoritative.receipt_state
          ):
              print("::warning::Diagnostic receipt mirror does not match authoritative ledger.")
          PY
          fi
      - name: Monitor authoritative terminal outcome
        env:
          GH_TOKEN: ${{ github.token }}
          PODCASTER_API_KEY: ${{ secrets.PODCASTER_API_KEY }}
          PODCASTER_STATUS_ENDPOINT: ${{ vars.PODCASTER_STATUS_ENDPOINT }}
        run: |
          python3 scripts/podcast_dispatch_state.py monitor \
            --receipt podcast-dispatch-authoritative-receipt.json \
            --endpoint "$PODCASTER_STATUS_ENDPOINT" --api-key "$PODCASTER_API_KEY" \
            --repo "${{ github.repository }}" --token "$GH_TOKEN" \
            --summary "$GITHUB_STEP_SUMMARY"
