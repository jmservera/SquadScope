name: Deploy Hugo site

on: # zizmor: ignore[dangerous-triggers] intentional post-crawl auto-deploy; build job is guarded by conclusion==success and actor checks
  push:
    branches:
      - main
  # Auto-deploy after a successful crawl-and-publish run so the site always
  # reflects the latest content committed to the publish branch.
  workflow_run:
    workflows: ["Crawl and publish weekly data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  build:
    # Allow manual triggers, human pushes to main, and post-crawl auto-runs.
    # Bot pushes are excluded from push events to avoid loops; workflow_run
    # covers the bot-written publish branch updates.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-actions[bot]') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      smoke_week: ${{ steps.podcaster-release.outputs.week }}
      smoke_article_url: ${{ steps.podcaster-release.outputs.article_url }}
      smoke_article_path: ${{ steps.podcaster-release.outputs.article_path }}
      smoke_article_sha256: ${{ steps.podcaster-release.outputs.article_sha256 }}
      smoke_promotion_reference: ${{ steps.podcaster-release.outputs.promotion_reference }}
    env:
      HUGO_VERSION: 0.161.1
      HUGO_PARAMS_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
      HUGO_PARAMS_GSC_SITE_VERIFICATION: ${{ secrets.GSC_SITE_VERIFICATION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Initialize theme submodule (with retry)
        # PaperMod is a public https submodule; retry to survive transient clone 5xx.
        run: |
          set -euo pipefail
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if git submodule update --init --recursive -- themes/PaperMod; then
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "::warning::PaperMod submodule init failed (attempt ${attempt}/${attempts}); retrying in $((attempt * 10))s" >&2
              sleep "$((attempt * 10))"
            fi
          done
          echo "::error::PaperMod submodule initialization failed after ${attempts} attempts" >&2
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install Hugo
        run: | # zizmor: ignore[github-env] writes a fixed runner path (${HOME}/.local/hugo) to GITHUB_PATH, not attacker input; needed so later steps can run hugo
          set -euo pipefail
          RELEASE_URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          TARBALL="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          CHECKSUM_FILE="hugo_${HUGO_VERSION}_checksums.txt"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-max-time 300 --retry-all-errors \
            --output "${TARBALL}" "${RELEASE_URL}/${TARBALL}"
          
          # Download and verify checksums
          curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-max-time 300 --retry-all-errors \
            --output "${CHECKSUM_FILE}" "${RELEASE_URL}/${CHECKSUM_FILE}"
          checksum_line="$(awk -v file="${TARBALL}" '$NF == file {print; found=1} END {if (!found) exit 1}' "${CHECKSUM_FILE}")" || {
            echo "Error: No checksum entry for ${TARBALL} found in ${CHECKSUM_FILE}" >&2
            exit 1
          }
          if ! printf '%s\n' "${checksum_line}" | sha256sum --check; then
            echo "Error: Checksum verification failed for ${TARBALL}" >&2
            exit 1
          fi
          rm "${CHECKSUM_FILE}"
          
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${TARBALL}"
          rm "${TARBALL}"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.local/hugo:${PATH}"
          hugo version

      - name: Hydrate generated content from publish
        # Architecture: code/theme/config come from main; generated content comes
        # from the canonical publish branch.
        run: |
          set -euo pipefail
          git fetch origin publish
          # Mirror publish for generated content. Only wipe+restore paths that
          # exist on publish; otherwise keep main's committed version so content
          # not yet published is not deleted (issues #627, #633).
          GENERATED_PATHS=(
            content/weekly/
            content/monthly/
            content/yearly/
            content/topics/
            content/data/
            data/analyzed/
            data/raw/
            data/metrics/
            data/snapshots/
            data/candidates/
            data/published/
            data/taxonomy/
            data/topic-hubs/
            data/derived/observatory/
            static/datasets/open-source-ai-github-projects-2026/
            static/tools/star-velocity-explorer.json
          )
          for path in "${GENERATED_PATHS[@]}"; do
            path="${path%/}"
            if [ -n "$(git ls-tree -r --name-only origin/publish -- "$path")" ]; then
              rm -rf "$path"
              git checkout origin/publish -- "$path"
            fi
          done
          echo "Hydrated from publish:"
          ls content/weekly/2026/ 2>/dev/null || true

      - name: Resolve promoted Podcaster release
        id: podcaster-release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from scripts.podcaster_handoff import article_url_from_page_path

          records = sorted(Path("data/published").glob("*/promotion-manifest.json"))
          if not records:
              raise SystemExit("No retained promotion record is available for release smoke.")

          promotion_reference = records[-1]
          record = json.loads(promotion_reference.read_text(encoding="utf-8"))
          if record.get("schema_version") != "promotion_transaction_v1":
              raise SystemExit(f"Unsupported promotion record: {promotion_reference}")
          article = next(
              (
                  artifact
                  for artifact in record.get("published_artifacts", [])
                  if artifact.get("role") == "hugo_content"
              ),
              None,
          )
          if not isinstance(article, dict):
              raise SystemExit(f"Promotion record lacks hugo_content: {promotion_reference}")

          article_path = Path(str(article.get("path") or ""))
          if not article_path.is_file():
              raise SystemExit(f"Promoted article does not exist: {article_path}")
          article_sha256 = hashlib.sha256(article_path.read_bytes()).hexdigest()
          if article_sha256 != article.get("sha256"):
              raise SystemExit(f"Promoted article bytes do not match: {promotion_reference}")

          outputs = {
              "week": str(record.get("week") or ""),
              "article_url": article_url_from_page_path("https://claracle.com/", article_path.as_posix()),
              "article_path": article_path.as_posix(),
              "article_sha256": article_sha256,
              "promotion_reference": promotion_reference.as_posix(),
          }
          if not outputs["week"]:
              raise SystemExit(f"Promotion record lacks week: {promotion_reference}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  print(f"{key}={value}", file=output)
          PY

      - name: Build site
        run: hugo --minify

      - name: Build Pagefind index
        run: npx pagefind --site public/

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: ./public
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: public

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.120.1'
          command: pages deploy public --project-name=claracle --branch=main

      - name: Verify production migration behavior
        run: python3 scripts/verify_repository_migration_http.py --attempts 12 --delay 10

  podcaster-release-smoke:
    needs: [build, deploy]
    permissions:
      contents: read
    uses: ./.github/workflows/podcaster-handoff-smoke.yml
    secrets:
      PODCASTER_API_KEY: ${{ secrets.PODCASTER_API_KEY }}
    with:
      week: ${{ needs.build.outputs.smoke_week }}
      article_url: ${{ needs.build.outputs.smoke_article_url }}
      article_path: ${{ needs.build.outputs.smoke_article_path }}
      article_sha256: ${{ needs.build.outputs.smoke_article_sha256 }}
      promotion_reference: ${{ needs.build.outputs.smoke_promotion_reference }}

  notify-failure:
    needs: [build, deploy, podcaster-release-smoke]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or update failure issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          RUN_URL="${SERVER_URL}/${GH_REPO}/actions/runs/${RUN_ID}"
          EXISTING=$(gh issue list --label 'deploy-failure' --state open --json number --jq length)
          if [ "$EXISTING" -gt 0 ]; then
            ISSUE_NUM=$(gh issue list --label 'deploy-failure' --state open --json number --jq '.[0].number')
            gh issue comment "$ISSUE_NUM" --body "Deploy failed again: ${RUN_URL}"
            echo "Updated existing issue #$ISSUE_NUM"
          else
            BODY=$(printf '%s\n\n%s\n\n%s\n%s\n%s' \
              "The Deploy Hugo site workflow failed." \
              "**Run:** ${RUN_URL}" \
              "Please triage:" \
              "- If transient (rate limit, network), close with comment" \
              "- If real bug, assign to the right squad member")
            gh issue create \
              --title "🔴 Deploy Hugo site failed (run ${RUN_ID})" \
              --label 'squad,deploy-failure' \
              --body "$BODY"
          fi
