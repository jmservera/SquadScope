name: Sync publish data to main

on: # zizmor: ignore[dangerous-triggers] intentional chaining off crawl-and-publish; sync job guarded by workflow_run.conclusion==success
  workflow_run:
    workflows: ["Crawl and publish weekly data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Prevent overlapping force-pushes to sync/publish-to-main
concurrency:
  group: sync-publish-to-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # The sync branch is pushed and the sync PR opened by a GitHub App, not by
    # GITHUB_TOKEN. pull_request runs for github-actions[bot] changes wait for
    # human approval (GitHub change of 2026-06-11), and check runs from
    # workflow_dispatch suites are not part of the PR's check rollup, so the
    # ruleset's required checks can never be met with GITHUB_TOKEN alone
    # (jmservera/SquadScope#826). Setup: docs/deployment/publish-sync-github-app.md
    environment: publish-sync
    permissions:
      checks: read # read the PR check rollup while waiting for required checks
      contents: write # squash-merge the sync PR; a GITHUB_TOKEN merge keeps push-to-main workflows quiet
      pull-requests: write # merge the sync PR
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Require publish-sync GitHub App configuration
        env:
          SYNC_APP_CLIENT_ID: ${{ vars.PUBLISH_SYNC_APP_CLIENT_ID }}
          SYNC_APP_PRIVATE_KEY: ${{ secrets.PUBLISH_SYNC_APP_PRIVATE_KEY }}
        run: |
          missing=""
          if [ -z "$SYNC_APP_CLIENT_ID" ]; then
            missing="${missing} variable PUBLISH_SYNC_APP_CLIENT_ID,"
          fi
          if [ -z "$SYNC_APP_PRIVATE_KEY" ]; then
            missing="${missing} secret PUBLISH_SYNC_APP_PRIVATE_KEY,"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Publish-sync GitHub App not configured::Missing${missing%,} in the publish-sync environment. Without the App, the sync PR cannot run its required pull_request checks (jmservera/SquadScope#826). Follow docs/deployment/publish-sync-github-app.md, then re-run this workflow with workflow_dispatch."
            exit 1
          fi
          # Shape check only; the key is never printed. Requiring the END line also
          # catches a paste that kept only the first line of the .pem file.
          if ! grep -q -- '-----BEGIN .*PRIVATE KEY-----' <<<"$SYNC_APP_PRIVATE_KEY" \
            || ! grep -q -- '-----END .*PRIVATE KEY-----' <<<"$SYNC_APP_PRIVATE_KEY"; then
            echo "::error title=PUBLISH_SYNC_APP_PRIVATE_KEY is not a PEM private key::The secret must be the full .pem file (BEGIN to END lines) from the App's Private keys section (Generate a private key), not an OAuth client secret. Set it from the file: gh secret set PUBLISH_SYNC_APP_PRIVATE_KEY --env publish-sync --repo jmservera/SquadScope < key.pem. See docs/deployment/publish-sync-github-app.md."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Sync data from publish
        id: sync
        env:
          SYNC_BRANCH: sync/publish-to-main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch publish
          git fetch origin publish

          # Create or reset sync branch from main
          git checkout -B "$SYNC_BRANCH" origin/main

          # Wipe target generated dirs so deletions on publish propagate to main
          rm -rf \
            data/raw \
            data/analyzed \
            data/metrics \
            data/topic-hubs \
            content/weekly \
            content/monthly \
            content/yearly

          # REQUIRED — these must exist on publish; fail loudly if not
          git checkout origin/publish -- \
            data/raw/ \
            data/analyzed/ \
            data/metrics/ \
            data/taxonomy/tags.json \
            data/taxonomy/topic-candidates.json \
            data/topic-hubs/ \
            content/weekly/ \
            content/monthly/ \
            content/yearly/
          rm -f data/metrics/copilot-transcript.md

          # Preserve curated seed hubs from main and carry only hubs explicitly
          # created by the dynamic lifecycle on publish.
          while IFS= read -r hub; do
            publish_frontmatter="$(git show "origin/publish:${hub}" | sed -n '1,/^---$/! { /^---$/q; p; }')"
            current_frontmatter=""
            if [ -f "$hub" ]; then
              current_frontmatter="$(sed -n '1,/^---$/! { /^---$/q; p; }' "$hub")"
            fi
            if grep -q '^  dynamic_topic: true$' <<< "$publish_frontmatter" \
              && { [ ! -f "$hub" ] || grep -q '^  dynamic_topic: true$' <<< "$current_frontmatter"; }; then
              git checkout origin/publish -- "$hub"
            fi
          done < <(git ls-tree -r --name-only origin/publish -- content/topics | grep '/_index.md$' || true)

          # Rebuild topics.json from main's seed hubs, synced dynamic hubs, and
          # the reconciled weekly corpus. Importing publish's whole registry can
          # retain stale static hubs that are intentionally absent from main.
          python3 scripts/taxonomy_registry.py
          python3 scripts/discover_topic_candidates.py

          # Rebuild rollups from the synced analyzed summaries so monthly/yearly
          # pages cannot drift from the weekly content in the generated sync PR.
          python3 scripts/generate_rollups.py

          # Regenerate derived Observatory artifacts from the synced crawl data
          # (same order as crawl-and-publish). The sync PR must pass the required
          # Python freshness tests before it can merge (#820).
          python3 scripts/observatory_repos.py
          python3 scripts/generate_repository_summary.py --from-crawl
          python3 scripts/generate_data_pages.py
          python3 scripts/generate_ranking_artifacts.py
          python3 scripts/export_observatory_dataset.py
          python3 scripts/export_trend_explorer_data.py

          # Stage restored/generated files before evaluating the cached diff.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --cached --name-only | grep -E '^\.squad/' >/dev/null; then
            echo "::error::Refusing to sync .squad state from publish to main."
            git diff --cached --name-only | grep -E '^\.squad/' || true
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes to sync after staging."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "sync: publish data → main

          Automated sync of crawl data, analysis, and content
          from the publish branch."

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mint publish-sync GitHub App token
        id: app-token
        if: steps.sync.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PUBLISH_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISH_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Push sync branch and open PR as the App
        id: pr
        if: steps.sync.outputs.changed == 'true'
        env:
          # The App identity makes pushes and PR events trigger the normal,
          # unapproved pull_request checks that the ruleset counts.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_SHA: ${{ steps.sync.outputs.head_sha }}
          SYNC_BRANCH: sync/publish-to-main
        run: |
          set -euo pipefail

          # A sync PR opened earlier by github-actions[bot] would keep holding
          # its pull_request runs for approval; replace it with an App-authored PR.
          PR_NUMBER=$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            PR_AUTHOR=$(gh pr view "$PR_NUMBER" --json author --jq '.author.login')
            if [ "$PR_AUTHOR" != "app/${APP_SLUG}" ] && [ "$PR_AUTHOR" != "${APP_SLUG}[bot]" ]; then
              echo "Closing sync PR #${PR_NUMBER} opened by ${PR_AUTHOR}; it is replaced by an App-authored PR."
              gh pr close "$PR_NUMBER" --comment "Superseded by an App-authored sync PR so required pull_request checks run without approval (jmservera/SquadScope#826)."
              PR_NUMBER=""
            fi
          fi

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH_HEADER#AUTHORIZATION: basic }"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
            push --force origin "${HEAD_SHA}:refs/heads/${SYNC_BRANCH}"

          if [ -n "$PR_NUMBER" ]; then
            echo "Updated existing PR #${PR_NUMBER}"
          else
            PR_URL=$(gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "sync: publish data → main" \
            --body "Automated sync of generated content and data subtrees from the publish branch to main.

          This PR keeps main up-to-date with generated data and content from the crawl/publish pipeline.

          **Synced paths (required — workflow fails if missing on publish):**
          - \`data/raw/\` — raw crawl data
          - \`data/analyzed/\` — weekly analysis summaries
          - \`data/metrics/\` — token usage metrics
          - \`data/taxonomy/\`, \`data/topic-hubs/\` — canonical and dynamic topic state
          - \`content/weekly/\`, \`content/monthly/\`, \`content/yearly/\` — generated Hugo pages
          - \`content/topics/\` — dynamic topic hubs overlaid onto durable seed hubs

          **Explicitly NOT synced:**
          - \`.squad/**\` — Squad memory, decisions, run counters, skills, logs, and agent histories are not authoritative on publish.

          **Notes:**
          - Publish is authoritative for replaced synced paths. Hand-edits on main to these paths WILL be overwritten.
          - Topic hubs are overlaid so durable seed pages absent from publish are preserved.

          Safe to merge — contains only generated data, no code changes.")
            PR_NUMBER="${PR_URL##*/}"
            case "$PR_NUMBER" in
              ''|*[!0-9]*)
                echo "::error::Could not parse the PR number from gh pr create output: ${PR_URL}"
                exit 1
                ;;
            esac
            if [ -n "$PR_NUMBER" ]; then
              gh api --silent "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" -f "labels[]=squad" || echo "::warning::Could not add the squad label to sync PR #${PR_NUMBER}."
            fi
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Could not determine PR number for sync branch $SYNC_BRANCH"
            exit 1
          fi
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Wait for required checks and merge
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.sync.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          # Poll every ruleset-required check by name until all have completed.
          # `gh pr checks` in watch mode returns as soon as the checks it can
          # already see finish, which can be before required checks register.
          python3 scripts/wait_for_required_checks.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --base main

          # Merge with GITHUB_TOKEN. Retry briefly in case another gate, such as
          # code scanning results, is still settling after the checks pass.
          for attempt in 1 2 3 4 5 6; do
            STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
            if [ "$STATE" = "MERGED" ]; then
              break
            fi
            if gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA"; then
              break
            fi
            echo "Merge attempt ${attempt} did not succeed; retrying in 30s."
            sleep 30
          done

          STATE=$(gh pr view "$PR_NUMBER" --json state,mergeStateStatus --jq '.state + " " + .mergeStateStatus')
          if [ "${STATE%% *}" != "MERGED" ]; then
            echo "::error::Sync PR #${PR_NUMBER} did not merge (state: ${STATE})."
            exit 1
          fi
          echo "Sync PR #${PR_NUMBER} merged."
