[repo_pages]
enabled = false
# Generate repository pages for repos appearing in more than this many distinct weekly issues.
# Default: >3 weekly issues, equivalent to at least 4 observed weeks.
recurrence_threshold_distinct_weekly_issues = 3
recurrence_threshold_operator = ">"
retention_years = 3

# Reviewed overrides are positive lifecycle evidence, primarily for confirmed deletions.
# Absence from a weekly crawl is never deletion evidence. Deleted histories remain for at
# least retention_years and are removed only after their persisted tombstone expires.
[repo_pages.lifecycle]

[topic_hubs]
seed_topics = [
  "AI Coding Agents",
  "MCP Ecosystem",
  "Open-Source LLMs",
  "Developer Tools",
  "AI Agents in Healthcare",
]

[topic_hubs.dynamic_creation]
enabled = false
min_weekly_issues = 4
lookback_days = 62
log_path = "data/topic-hubs/dynamic-topic-creation.log"
ignore_topics = [
  "ai",
  "artificial intelligence",
  "apps",
  "security",
  "startups",
  "the download",
]
